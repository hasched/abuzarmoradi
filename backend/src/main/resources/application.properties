# =============================================================
# abuzarmoradi.com — Quarkus Backend Configuration
# =============================================================

quarkus.application.name=portfolio-backend
quarkus.application.version=1.0.0

# --- HTTP ---
quarkus.http.port=${PORT:8080}
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200,https://abuzarmoradi.com,https://www.abuzarmoradi.com
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept,X-Requested-With

# --- Database (Using Railway's exact variable names) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}
quarkus.datasource.jdbc.max-size=16

# --- Hibernate ---
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# --- Flyway migrations ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.baseline-on-migrate=true

# --- OpenAPI ---
quarkus.smallrye-openapi.path=/api/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/api/swagger-ui

# --- Health ---
quarkus.smallrye-health.root-path=/api/health

# --- Dev profile ---
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.log.level=INFO

# --- Production ---
%prod.quarkus.log.level=WARN
%prod.quarkus.http.ssl-port=8443